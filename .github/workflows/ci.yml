name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, 1.85] # MSRV
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Run tests (all features)
        run: cargo test --all-features

      # Nonsense: tests are definitely `std` envronment and cannot run in no_std.
      # - name: Run tests (no_std)
      #   run: cargo test --no-default-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate coverage report (HTML + JSON)
        run: |
          cargo llvm-cov --all-features --html --output-dir target/llvm-cov
          cargo llvm-cov --all-features --json --output-path target/llvm-cov/coverage.json

      - name: Debug coverage output
        run: |
          echo "=== Directory structure ==="
          find target/llvm-cov -type f | head -20
          echo "=== HTML directory ==="
          ls -la target/llvm-cov/html || echo "html directory not found"

      - name: Generate coverage badge
        run: |
          set -e
          PERCENT=$(jq -r '.data[0].totals.lines.percent // 0' target/llvm-cov/coverage.json | xargs printf "%.0f")

          if [ "$PERCENT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PERCENT" -ge 75 ]; then COLOR="green"
          elif [ "$PERCENT" -ge 60 ]; then COLOR="yellowgreen"
          elif [ "$PERCENT" -ge 40 ]; then COLOR="yellow"
          elif [ "$PERCENT" -ge 20 ]; then COLOR="orange"
          else COLOR="red"; fi

          cat > target/llvm-cov/coverage-badge.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="120" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h62v20H0z"/>
              <path fill="${COLOR/#/\\#}" d="M62 0h58v20H62z"/>
              <path fill="url(#b)" d="M0 0h120v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="31" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="31" y="14">coverage</text>
              <text x="90" y="15" fill="#010101" fill-opacity=".3">${PERCENT}%</text>
              <text x="90" y="14">${PERCENT}%</text>
            </g>
          </svg>
          EOF

          echo "Coverage: $PERCENT%"
        id: badge

      - name: Debug HTML structure
        run: |
          echo "=== Full HTML structure ==="
          find target/llvm-cov/html -type f | head -50
          echo ""
          echo "=== Looking for index.html ==="
          find target/llvm-cov/html -name "index.html" -type f

      - name: Prepare deployment directory
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)

          mkdir -p deploy/cov/$SHORT_SHA

          # Find the actual index.html location
          INDEX_PATH=$(find target/llvm-cov/html -name "index.html" -type f | head -1)

          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found in target/llvm-cov/html"
            find target/llvm-cov -type f
            exit 1
          fi

          echo "Found index.html at: $INDEX_PATH"

          # Get the directory containing index.html
          HTML_DIR=$(dirname "$INDEX_PATH")
          echo "HTML directory: $HTML_DIR"

          # Copy the entire HTML directory structure
          cp -r "$HTML_DIR"/* deploy/cov/$SHORT_SHA/
          cp target/llvm-cov/coverage-badge.svg deploy/cov/$SHORT_SHA/badge.svg

          # Verify index.html exists
          if [ ! -f "deploy/cov/$SHORT_SHA/index.html" ]; then
            echo "ERROR: index.html not copied correctly"
            ls -la deploy/cov/$SHORT_SHA/
            exit 1
          fi

          # Update latest
          rm -rf deploy/cov/latest || true
          cp -r deploy/cov/$SHORT_SHA deploy/cov/latest

          # Add .nojekyll
          touch deploy/.nojekyll

          # Root redirect
          cat > deploy/index.html <<'ROOTEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=cov/latest/index.html">
            <title>charry coverage</title>
          </head>
          <body>
            <p>Redirecting to <a href="cov/latest/index.html">latest coverage report</a>...</p>
          </body>
          </html>
          ROOTEOF

          echo "✓ Deployment prepared successfully"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          force: true

      - name: Output coverage URL
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          REPO=${{ github.repository }}
          echo "::notice::Coverage report: https://${REPO/\//.github.io/}/cov/$SHORT_SHA/"
          echo "::notice::Latest: https://${REPO/\//.github.io/}/cov/latest/"
          echo "::notice::Badge: https://${REPO/\//.github.io/}/cov/latest/badge.svg"
