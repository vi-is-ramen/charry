name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on crates.io
        id: check
        run: |
          CRATE_NAME=$(grep '^name = ' Cargo.toml | cut -d'"' -f2)
          VERSION="${{ steps.version.outputs.version }}"

          if curl -s "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" | grep -q '"version"'; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create and push git tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated release for version ${{ steps.version.outputs.tag }}

            Published to [crates.io](https://crates.io/crates/${{ github.event.repository.name }}/${{ steps.version.outputs.version }})
          draft: false
          prerelease: false
